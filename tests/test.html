<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes tests</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f4; color: #1c1917; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    #summary { font-weight: 600; font-size: 1.1rem; }
    #summary.pass, .pass { color: #15803d; }
    #summary.fail, .fail { color: #b91c1c; }
    #results { padding: 0; list-style: none; font-family: ui-monospace, Consolas, monospace; white-space: pre-wrap; }
    #results li { padding: 2px 0; }
    iframe { width: 100%; height: 420px; border: 1px solid #a8a29e; border-radius: 6px; background: #fff; }
    button { font: inherit; padding: 6px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Notes-Web-App: browser tests</h1>
    <p>These tests drive the real app in the frame below. No install is needed.</p>
    <p id="summary">Running...</p>
    <button id="run-again" type="button">Run again</button>
    <ul id="results"></ul>
    <iframe id="app-frame" title="App under test"></iframe>
  </main>
  <script src="browser-tests.js"></script>
</body>
</html>
